<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاقیکردنەوەی زیندەزانی</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rabar&display=swap');
        
        body {
            font-family: 'Tahoma', Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            color: #1f2937;
        }
        
        /* شێوەی ئەپڵیکەیشنی مۆبایل */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        
        /* بەشی سەرەوە (Header) */
        .header {
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
            padding: 20px 20px 25px 20px;
            text-align: center;
            border-bottom-left-radius: 25px;
            border-bottom-right-radius: 25px;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
            position: relative;
        }
        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
        }
        .back-btn {
            position: absolute;
            right: 20px;
            top: 22px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 5px 12px;
            border-radius: 8px;
            font-family: inherit;
            cursor: pointer;
            font-size: 14px;
            display: none;
        }

        /* پەڕەی سەرەکی (لیستی بەندەکان) */
        #home-screen {
            padding: 25px 20px;
        }
        .section-title {
            color: #6b7280;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .chapter-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 2px solid #e5e7eb;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .chapter-card:hover {
            border-color: #4f46e5;
            background: #f8fafc;
        }
        .chapter-title {
            font-size: 18px;
            font-weight: bold;
            color: #111827;
        }
        .chapter-icon {
            font-size: 28px;
        }

        /* پەڕەی تاقیکردنەوە */
        #quiz-screen {
            display: none;
            padding: 20px;
        }
        .question-box {
            background: #ffffff;
            border: 2px solid #f3f4f6;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            margin-bottom: 20px;
            font-size: 18px;
            line-height: 1.6;
            font-weight: bold;
            color: #1f2937;
        }
        
        .option-btn {
            width: 100%;
            text-align: right;
            background: #ffffff;
            border: 2px solid #e5e7eb;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            transition: 0.2s;
            color: #4b5563;
        }
        .option-btn:hover:not(:disabled) {
            border-color: #9ca3af;
            background: #f9fafb;
        }
        .option-btn:disabled {
            cursor: default;
        }
        
        /* ڕەنگەکانی ڕاست و هەڵە */
        .correct {
            background-color: #ecfdf5 !important;
            border-color: #10b981 !important;
            color: #047857 !important;
            font-weight: bold;
        }
        .wrong {
            background-color: #fef2f2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
            font-weight: bold;
        }

        /* بۆکسی ئیستیدلال */
        .explanation-box {
            display: none;
            background: #e0f2fe;
            padding: 20px;
            border-radius: 12px;
            border-right: 6px solid #0284c7;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .explanation-title {
            color: #0369a1;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .explanation-text {
            font-size: 15px;
            line-height: 1.7;
            color: #334155;
        }

        /* دوگمەی داهاتوو */
        .next-btn {
            width: 100%;
            background: #4f46e5;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            display: none;
            box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
        }
        .next-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- بەشی سەرەوە -->
    <div class="header">
        <button id="back-btn" class="back-btn" onclick="goHome()">🔙 گەڕانەوە</button>
        <h1 id="header-title">زیندەزانی - پۆلی ١٢</h1>
    </div>

    <!-- پەڕەی سەرەکی (لیستی بەندەکان) -->
    <div id="home-screen">
        <div class="section-title">پڕۆگرامی تاقیکردنەوەکان:</div>
        
        <div class="chapter-card" onclick="startChapter('bandi1')">
            <div class="chapter-title">بەندی ١: پەیکەرە و ماسولکە</div>
            <div class="chapter-icon">🦴</div>
        </div>
        
        <div class="chapter-card" onclick="alert('ئەم بەندە هێشتا پرسیاری تێدا نییە.')">
            <div class="chapter-title" style="color: #9ca3af;">بەندی ٢: کۆئەندامی دەمار</div>
            <div class="chapter-icon" style="opacity: 0.5;">🧠</div>
        </div>
    </div>

    <!-- پەڕەی تاقیکردنەوە -->
    <div id="quiz-screen">
        <div class="question-box" id="question-text"></div>
        <div id="options-container"></div>
        
        <div id="explanation-box" class="explanation-box">
            <div class="explanation-title">📌 بەڵگە لە دەقەکەوە:</div>
            <div id="explanation-text" class="explanation-text"></div>
        </div>
        <button id="next-btn" class="next-btn" onclick="nextQuestion()">پرسیاری داهاتوو ⏭</button>
    </div>
</div>

<script>
    // داتابەیسی پرسیارەکان (لێرەدا جێگیر کراوە بۆ ئەوەی خێرا کار بکات)
    const database = {
        bandi1: [
            {
                question: "کاتێك دەمارە ڕاگەیاندن ماسولکە ئاگادار دەکاتەوە بۆ ئەوەی گرژبێت، کام لەم کردارانەی خوارەوە ڕوودەدات؟",
                options: [
                    "نووکەکانی مایۆسین بە شوێنی نێوان مۆرووەکانی دەزوولەی ئەکتینەوە دەبەسترێن و پانەپرد پێکدەهێنن.",
                    "دەزوولەکانی ئەکتین دەبنە هۆی دروستبوونی شێوەی نووکی هێلکەیی.",
                    "پانەپردەکان هەڵدەوەشێنن و نووکەکان دەگەڕێنەوە جێگەی خۆیان بۆ خاوبوونەوە.",
                    "درێژی دەزوولەکانی مایۆسین و ئەکتین کورت دەبنەوە و بە ناو یەکدا دەچن."
                ],
                correctAnswer: "نووکەکانی مایۆسین بە شوێنی نێوان مۆرووەکانی دەزوولەی ئەکتینەوە دەبەسترێن و پانەپرد پێکدەهێنن.",
                explanation: "کاتێك دەمارە ڕاگەیاندن ماسولکە ئاگادار دەکاتەوە بۆ ئەوەی گرژبێت، نووکەکانی دەزوولەی مایۆسین بە شوێنی نێوان مۆرووەکانی دەزوولەی ئەکتینەوە دەبەسترێن و پانەپرد پێکدەهێنن."
            },
            {
                question: "بەپێی دەقی کتێبەکە، ماسولکە لووسەکان بە کام لەم خاڵانەی خوارەوە جیادەکرێنەوە لە ماسولکەی پەیکەرە؟",
                options: [
                    "خۆویستن و بە ویستی کەسەکە کۆنترۆڵ دەکرێن.",
                    "یەکناگرن بۆ پێکهێنانی ژێیەکان.",
                    "دیواری دڵ پێکدەهێنن و یەک ناووکیان هەیە.",
                    "خانەکانیان هێڵدارن و فرە ناووکن."
                ],
                correctAnswer: "یەکناگرن بۆ پێکهێنانی ژێیەکان.",
                explanation: "لووسە ماسولکەکان یەکناگرن بۆ پێکهێنانی ژێیەکان وەک لە پەیکەرە ماسولکەدا."
            }
        ]
    };

    let currentQuestions = [];
    let currentQuestionIndex = 0;

    // کردنەوەی بەندێک
    function startChapter(chapterId) {
        currentQuestions = database[chapterId];
        currentQuestionIndex = 0;
        
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        document.getElementById('back-btn').style.display = 'block';
        document.getElementById('header-title').innerText = "تاقیکردنەوەی بەندی ١";
        
        loadQuestion();
    }

    // گەڕانەوە بۆ پەڕەی سەرەکی
    function goHome() {
        document.getElementById('home-screen').style.display = 'block';
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('back-btn').style.display = 'none';
        document.getElementById('header-title').innerText = "زیندەزانی - پۆلی ١٢";
    }

    // هێنانی پرسیار
    function loadQuestion() {
        const currentQuestion = currentQuestions[currentQuestionIndex];
        document.getElementById('question-text').innerText = currentQuestion.question;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        document.getElementById('explanation-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';

        currentQuestion.options.forEach(optionText => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = optionText;
            button.onclick = () => selectAnswer(button, optionText, currentQuestion.correctAnswer, currentQuestion.explanation);
            optionsContainer.appendChild(button);
        });
    }

    // پشکنینی وەڵام
    function selectAnswer(selectedBtn, selectedText, correctText, explanationText) {
        const allButtons = document.querySelectorAll('.option-btn');
        allButtons.forEach(btn => btn.disabled = true); // قوفڵکردنی دوگمەکان

        if (selectedText === correctText) {
            selectedBtn.classList.add('correct');
        } else {
            selectedBtn.classList.add('wrong');
            // سەوزکردنی وەڵامە ڕاستەکە
            allButtons.forEach(btn => {
                if (btn.innerText === correctText) {
                    btn.classList.add('correct');
                }
            });
        }

        // نیشاندانی بەڵگەکە
        document.getElementById('explanation-text').innerText = explanationText;
        document.getElementById('explanation-box').style.display = 'block';

        // دەرکەوتنی دوگمەی داهاتوو
        const nextBtn = document.getElementById('next-btn');
        if (currentQuestionIndex < currentQuestions.length - 1) {
            nextBtn.innerText = "پرسیاری داهاتوو ⏭";
        } else {
            nextBtn.innerText = "کۆتایی بەندەکە 🏠";
        }
        nextBtn.style.display = 'block';
    }

    // چوونە سەر پرسیاری داهاتوو
    function nextQuestion() {
        if (currentQuestionIndex < currentQuestions.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            goHome(); // ئەگەر تەواو بوو دەگەڕێتەوە لیستی بەندەکان
        }
    }
</script>

</body>
</html>
